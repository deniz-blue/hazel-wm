[package]
name = "hazel"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.2.1"
mlua = { version = "0.11.6", features = [
	"macros",
	"mlua_derive",
	"serde",
	"userdata-wrappers",
] }
mlua-pkg = "0.3.0"
calloop-notify = "0.2.0"
tracing = "0.1.44"

[dependencies.smithay]
version = "0.7.0"
features = [
	"backend_winit",
	"wayland_frontend",
	"desktop",
	"backend_udev",
	"backend_libinput",
	"backend_session",
	"backend_session_libseat",
	"backend_drm",
	"backend_gbm",
	"backend_egl",
	"renderer_gl",
	"renderer_multi",
	"use_system_lib",
]
